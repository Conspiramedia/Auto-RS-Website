# ============================================================
# RS AUTO — конфигурация ЛОКАЛЬНОГО Supabase (только тесты и разработка).
# ============================================================
# Файл описывает стек, который поднимает `supabase start` в Docker:
# Postgres, GoTrue (auth), PostgREST, Storage. К БОЕВОМУ проекту он
# отношения не имеет — там настройки живут в панели Supabase, и этот
# файл их не меняет и не может изменить.
#
# ЗАЧЕМ ЛОКАЛЬНЫЙ СТЕК, А НЕ ВТОРОЙ ОБЛАЧНЫЙ ПРОЕКТ. Тесты обязаны
# начинаться с известного состояния базы: `supabase db reset` заново
# накатывает все миграции и seed, поэтому прогон не зависит от того,
# что осталось от предыдущего. Общая облачная база такого не даёт —
# два прогона подряд влияли бы друг на друга, а параллельные ветки
# в CI дрались бы за одни и те же строки. Плюс в CI не нужны секреты:
# ключи локального стека фиксированы и одинаковы у всех.
#
# ГЛАВНОЕ — ИЗОЛЯЦИЯ ОТ ПРОДА. Порт 54321 и ключи ниже принадлежат
# только этому стеку. `project_id` НЕ связывает файл с облачным
# проектом: связь задаётся отдельной командой `supabase link`, и её
# результат лежит в supabase/.temp (в .gitignore).
# ============================================================

project_id = "auto-rs-website"

[api]
enabled = true
# Порт локального API. Тот же адрес прописан в .env.test как
# NEXT_PUBLIC_SUPABASE_URL — сборка под тесты ходит только сюда.
port = 54321
# Схемы, доступные через PostgREST. public — вся бизнес-логика сайта;
# graphql_public оставлен по умолчанию CLI.
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
# Потолок строк в одном ответе. Совпадает с боевой настройкой по
# умолчанию: тест, упирающийся в лимит локально, упрётся и на проде.
max_rows = 1000

[db]
# Порт Postgres. Нестандартный (не 5432) намеренно: локальная база
# разработчика, если она есть, не должна конфликтовать со стеком.
port = 54322
shadow_port = 54320
# Версия сервера — та же мажорная, что в облачном проекте. Разойдись
# они, часть SQL прошла бы локально и упала на проде.
major_version = 17

[db.pooler]
enabled = false

[storage]
enabled = true
# Фотографии объявлений (бакет car-images). Лимит совпадает с боевым.
file_size_limit = "50MiB"

[auth]
enabled = true
# ВАЖНО: адрес сайта под тестами. GoTrue подставляет его в ссылки
# писем и проверяет по нему redirect'ы.
site_url = "http://127.0.0.1:3000"
additional_redirect_urls = ["http://127.0.0.1:3000", "http://localhost:3000"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
# Регистрация открыта: seed заводит пользователей через служебный API.
enable_signup = true

[auth.email]
# ПОЧЕМУ ЗДЕСЬ НЕТ `enabled`. Такого ключа в схеме config.toml нет —
# CLI 2.109 отвергает конфиг целиком с «'auth.email' has invalid keys:
# enabled», и тогда не работает НИ ОДНА команда, включая `supabase
# status` и `db push` (парсинг идёт до обращения к Docker).
# Вход по почте включается самим присутствием секции, а разрешение
# регистрации задаёт enable_signup — он и стоял здесь по смыслу.
enable_signup = true
# Подтверждение адреса выключено: seed создаёт пользователей сразу
# подтверждёнными, а тесты входа не ходят в почтовый ящик вовсе —
# они перехватывают запрос на уровне браузера (tests/e2e/fixtures).
enable_confirmations = false
secure_password_change = false

[auth.sms]
# SMS локально НЕ отправляются. Провайдера нет, и он не нужен:
# UI-тесты входа по телефону перехватывают запрос Playwright'ом, а
# серверные квоты и гейт проверяются SQL-тестами напрямую.
enable_signup = true
enable_confirmations = false

[auth.sms.test_otp]
# Фиксированные коды для тестовых номеров: GoTrue принимает их без
# отправки SMS. Нужны на случай, когда тест идёт через настоящий
# verifyOtp, а не через перехват.
# Номер тестового пользователя из seed — см. supabase/seed.sql.
"+381601234567" = "123456"

[analytics]
enabled = false

# Раньше секция называлась [inbucket]; CLI её ещё понимает, но на
# каждую команду печатает предупреждение об устаревании. Имя и набор
# ключей те же, поэтому переименование ничего не меняет по поведению.
[local_smtp]
# Локальный почтовый ящик-заглушка: письма GoTrue не уходят наружу,
# а оседают здесь. Нужен, чтобы вход по почте в локальной отладке
# можно было довести до конца, не имея Resend.
enabled = true
# Порт веб-интерфейса ящика.
port = 54324
