# ============================================================
# RS AUTO — CI: проверки на каждый push и pull request.
# ============================================================
# Живых тестировщиков у проекта нет, поэтому единственный рубеж между
# ошибкой и продом — этот файл. Порядок работ выстроен от дешёвого к
# дорогому: типы и сборка падают за минуту и отменяют смысл гонять
# получасовой Playwright.
#
# ГДЕ БЕРЁТСЯ БАЗА. Локальный Supabase в Docker, поднимается прямо в
# раннере (`supabase start`). Боевой проект в CI не участвует ни при
# каких условиях: секретов от него здесь нет, а tests/env.ts падает,
# если адрес указывает на боевой домен.
#
# ПОЧЕМУ CLI СТАВИТСЯ ЯВНО. На ubuntu-latest есть Docker, но НЕТ
# supabase CLI — он не входит в образ раннера и не лежит в
# devDependencies. Раньше шаги звали `supabase start` напрямую и
# падали с `command not found`; отсюда и были красные SQL, E2E и
# Lighthouse при зелёной сборке. Ставим его шагом supabase/setup-cli.
# ============================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Ручной запуск. Нужен работе Lighthouse: она отключена на push и
  # pull_request (см. TODO ниже) и вызывается кнопкой Run workflow.
  workflow_dispatch:

# Новый пуш в ту же ветку отменяет предыдущий прогон: держать в
# очереди сборку кода, который уже переписан, незачем.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Все шаги читают окружение отсюда — те же значения, что в .env.test.
  # Это адреса локального стека и его публичный демо-ключ; секретов
  # боевого проекта в этом файле нет и быть не должно.
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
  NEXT_PUBLIC_SITE_BASE_URL: http://127.0.0.1:3100
  NEXT_PUBLIC_PLAUSIBLE_DOMAIN: ''
  # Версия CLI фиксирована: «latest» однажды поменяет формат вывода
  # `supabase status -o env`, и scripts/run-sql-checks.mjs перестанет
  # находить DB_URL — то есть тихо начнёт пропускать все SQL-тесты.
  SUPABASE_CLI_VERSION: 2.108.0

jobs:
  # ------------------------------------------------------------
  # 1) Типы и сборка. Быстрый рубеж.
  # ------------------------------------------------------------
  build:
    name: Типы и сборка
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Проверка типов
        run: npm run typecheck

      - name: Сборка
        run: npm run build

      # Сборку переиспользуют следующие работы: пересобирать сайт
      # трижды — минус несколько минут на каждом прогоне.
      #
      # include-hidden-files обязателен: .next начинается с точки, и
      # без флага actions/upload-artifact@v4 кладёт в архив пустоту.
      # Именно поэтому «восстановленная» сборка в E2E и Lighthouse
      # оказывалась ничем, и next start падал на старте.
      - name: Сохранить сборку
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: .next
          include-hidden-files: true
          retention-days: 1

  # ------------------------------------------------------------
  # 2) SQL-тесты серверных гейтов.
  # ------------------------------------------------------------
  # Отдельная работа: они не зависят от сборки сайта и идут
  # параллельно с Playwright.
  sql:
    name: SQL-тесты гейтов
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      # CLI нужен и для стека, и для `supabase status -o env`, откуда
      # scripts/run-sql-checks.mjs берёт строку подключения.
      - name: Установка Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      # Поднимаем минимальный набор контейнеров: SQL-тестам нужны
      # только Postgres и Kong. Studio, realtime, storage, imgproxy и
      # почтовая заглушка — это лишние минуты скачивания образов.
      # Имена в -x берутся из `supabase start --help`; несуществующее
      # имя (storage-api, logflare, supavisor) роняет команду.
      - name: Поднять локальный Supabase
        run: |
          supabase start \
            -x realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor,mailpit
          supabase db reset --local

      # psql идёт из postgresql-client, который на ubuntu-latest уже
      # установлен. Проверяем явно: без него run-sql-checks.mjs упал
      # бы на каждом файле с ENOENT.
      - name: Проверить psql
        run: psql --version

      - name: Прогон SQL-тестов
        run: npm run test:sql

      # Логи контейнеров: если стек поднялся, но база отвечает не тем,
      # разбирать это по выводу psql невозможно.
      - name: Логи Supabase при падении
        if: failure()
        run: supabase status || docker ps -a

  # ------------------------------------------------------------
  # 3) Playwright: desktop + mobile.
  # ------------------------------------------------------------
  e2e:
    name: E2E (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30

    strategy:
      # Падение десктопа не должно прятать результат мобильного:
      # это разные раскладки и разные поломки.
      fail-fast: false
      matrix:
        project: [chromium-desktop, chromium-mobile]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      # Кэш браузеров: скачивание Chromium занимает около минуты и
      # не меняется между прогонами.
      - name: Кэш браузеров Playwright
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Установка браузеров
        # --with-deps ставит системные библиотеки, без которых
        # Chromium в раннере не стартует.
        run: npx playwright install --with-deps chromium chromium-headless-shell

      - name: Установка Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Поднять локальный Supabase
        run: |
          supabase start \
            -x realtime,imgproxy,studio,edge-runtime,logflare,vector,supavisor,mailpit
          supabase db reset --local

      - name: Восстановить сборку
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next

      # Прогон идёт через dotenv -e .env.test — ровно как локально.
      # Голый `npx playwright test` брал переменные только из env
      # работы, и любое расхождение с .env.test означало бы, что в CI
      # проверяется не та конфигурация, что у разработчика.
      # Сервер поднимает сам Playwright (webServer), причём в CI без
      # пересборки: .next уже восстановлен из артефакта.
      - name: Прогон тестов
        run: npm run test:e2e -- --project=${{ matrix.project }}

      # Артефакты падений: без трейса разбирать упавший тест в CI
      # практически невозможно — логов недостаточно.
      - name: Сохранить отчёт и трейсы
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ------------------------------------------------------------
  # 4) Lighthouse CI — бюджеты производительности и SEO.
  # ------------------------------------------------------------
  # ВРЕМЕННО ОТКЛЮЧЁН (workflow_dispatch — запуск только вручную).
  #
  # TODO(lighthouse): вернуть в push/pull_request после калибровки
  # порогов. Причина отключения — не окружение: оно здесь такое же,
  # как в E2E, и стек поднимается. Проблема в бюджетах: пороги
  # (performance ≥0.9, CLS ≤0.1) выставлены по замерам на локальной
  # машине разработчика, а двухъядерный общий раннер GitHub даёт
  # разброс в 10–15 пунктов между прогонами одного и того же кода.
  # Работа краснела бы через раз без изменений в коде, а к постоянно
  # красной работе привыкают и перестают читать — тогда и настоящее
  # падение E2E проходит незамеченным. Что сделать перед возвратом:
  # снять 5–10 прогонов через workflow_dispatch, взять минимум по
  # каждой метрике, опустить пороги до него и оставить 'error'
  # только на CLS и SEO — они от мощности машины почти не зависят.
  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 25
    # Отключение: работа не запускается на push и pull_request, но
    # остаётся рабочей и вызывается вручную кнопкой Run workflow.
    if: github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Установка Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: ${{ env.SUPABASE_CLI_VERSION }}

      - name: Поднять локальный Supabase
        run: |
          supabase start \
            -x realtime,imgproxy,studio,edge-runtime,logflare,vector,supavisor,mailpit
          supabase db reset --local

      - name: Восстановить сборку
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next

      # Через dotenv по той же причине, что и E2E: lighthouserc.js
      # поднимает `npm run start`, и адрес базы должен прийти из
      # .env.test, а не из окружения разработчика.
      - name: Прогон Lighthouse
        run: npx dotenv -e .env.test -- npx lhci autorun

      - name: Сохранить отчёты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 7
