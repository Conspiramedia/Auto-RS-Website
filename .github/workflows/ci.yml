# ============================================================
# RS AUTO — CI: проверки на каждый push и pull request.
# ============================================================
# Живых тестировщиков у проекта нет, поэтому единственный рубеж между
# ошибкой и продом — этот файл. Порядок работ выстроен от дешёвого к
# дорогому: типы и сборка падают за минуту и отменяют смысл гонять
# получасовой Playwright.
#
# ГДЕ БЕРЁТСЯ БАЗА. Локальный Supabase в Docker, поднимается прямо в
# раннере (`supabase start`). Боевой проект в CI не участвует ни при
# каких условиях: секретов от него здесь нет, а tests/env.ts падает,
# если адрес указывает на боевой домен.
# ============================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Новый пуш в ту же ветку отменяет предыдущий прогон: держать в
# очереди сборку кода, который уже переписан, незачем.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Все шаги читают окружение отсюда — те же значения, что в .env.test.
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0
  NEXT_PUBLIC_SITE_BASE_URL: http://127.0.0.1:3100
  NEXT_PUBLIC_PLAUSIBLE_DOMAIN: ''

jobs:
  # ------------------------------------------------------------
  # 1) Типы и сборка. Быстрый рубеж.
  # ------------------------------------------------------------
  build:
    name: Типы и сборка
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Проверка типов
        run: npm run typecheck

      - name: Сборка
        run: npm run build

      # Сборку переиспользуют следующие работы: пересобирать сайт
      # трижды — минус несколько минут на каждом прогоне.
      - name: Сохранить сборку
        uses: actions/upload-artifact@v4
        with:
          name: next-build
          path: |
            .next
            !.next/cache
          retention-days: 1

  # ------------------------------------------------------------
  # 2) Playwright: desktop + mobile.
  # ------------------------------------------------------------
  e2e:
    name: E2E (${{ matrix.project }})
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30

    strategy:
      # Падение десктопа не должно прятать результат мобильного:
      # это разные раскладки и разные поломки.
      fail-fast: false
      matrix:
        project: [chromium-desktop, chromium-mobile]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      # Кэш браузеров: скачивание Chromium занимает около минуты и
      # не меняется между прогонами.
      - name: Кэш браузеров Playwright
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Установка браузеров
        # --with-deps ставит системные библиотеки, без которых
        # Chromium в раннере не стартует.
        run: npx playwright install --with-deps chromium chromium-headless-shell

      # ---------- Локальный Supabase ----------
      - name: Поднять локальный Supabase
        run: |
          supabase start -x realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor
          supabase db reset --local

      - name: Восстановить сборку
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next

      - name: Прогон тестов
        run: npx playwright test --project=${{ matrix.project }}

      # Артефакты падений: без трейса разбирать упавший тест в CI
      # практически невозможно — логов недостаточно.
      - name: Сохранить отчёт и трейсы
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-${{ matrix.project }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ------------------------------------------------------------
  # 3) SQL-тесты серверных гейтов.
  # ------------------------------------------------------------
  # Отдельная работа: они не зависят от сборки сайта и идут
  # параллельно с Playwright.
  sql:
    name: SQL-тесты гейтов
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Поднять локальный Supabase
        run: |
          supabase start -x realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor
          supabase db reset --local

      - name: Прогон SQL-тестов
        run: npm run test:sql

  # ------------------------------------------------------------
  # 4) Lighthouse CI — бюджеты производительности и SEO.
  # ------------------------------------------------------------
  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установка зависимостей
        run: npm ci

      - name: Поднять локальный Supabase
        run: |
          supabase start -x realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor
          supabase db reset --local

      - name: Восстановить сборку
        uses: actions/download-artifact@v4
        with:
          name: next-build
          path: .next

      - name: Прогон Lighthouse
        run: npx lhci autorun

      - name: Сохранить отчёты
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci/
          retention-days: 7
